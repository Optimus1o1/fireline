services:
  - type: web
    name: fireline
    runtime: node
    plan: free
    region: singapore
    branch: master
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
